services:
  backend:
    build:
      context: ./backend
    container_name: weddingapp-backend
    expose:
      - "8000"
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: weddingapp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
