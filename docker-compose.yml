services:
  backend:
    build:
      context: ./backend
    container_name: weddingapp-backend
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: weddingapp-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/media:/usr/share/nginx/html/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
